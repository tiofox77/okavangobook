<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sem ligação — KiandaStay</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #1a5fae 0%, #0d3a6b 100%); color: #fff; text-align: center; padding: 24px;
        }
        .card { max-width: 420px; }
        img { width: 96px; height: 96px; margin-bottom: 24px; }
        h1 { font-size: 1.6rem; margin-bottom: 12px; }
        p { opacity: .85; line-height: 1.6; margin-bottom: 24px; }
        button {
            background: #f59e0b; color: #1a2b4a; border: 0; padding: 12px 28px;
            border-radius: 9999px; font-weight: 700; font-size: 1rem; cursor: pointer;
        }
        button:hover { background: #d98a06; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/assets/img/icon-192.png" alt="KiandaStay">
        <h1>Está sem ligação</h1>
        <p>Não foi possível carregar esta página. Verifique a sua ligação à Internet e tente novamente.</p>
        <button onclick="location.reload()">Tentar novamente</button>
    </div>
</body>
</html>
